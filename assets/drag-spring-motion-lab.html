  <body>
    <main id="stage" class="stage" aria-live="polite"></main>

    <aside class="spring-lab" data-open aria-label="Apple spring 调节">
      <div class="spring-lab-header">
        <div class="spring-lab-title" data-spring-lab-handle tabindex="0" aria-label="拖动动画面板；使用方向键微调位置"><strong data-motion-title>Apple spring</strong><span data-spring-component>Lift List · 独立配置</span></div>
        <button class="spring-lab-toggle" type="button" aria-controls="spring-lab-body" aria-expanded="true">收起</button>
      </div>
      <div id="spring-lab-body" class="spring-lab-body">
        <div class="spring-playback">
          <span class="spring-playback-label" id="spring-playback-label">播放速度</span>
          <div class="spring-playback-rates" role="group" aria-labelledby="spring-playback-label">
            <button class="spring-preset" type="button" data-playback-rate="1" data-active aria-pressed="true" aria-label="1× 正常速度">1×</button>
            <button class="spring-preset" type="button" data-playback-rate="0.75" aria-pressed="false" aria-label="0.75× 播放速度">0.75×</button>
            <button class="spring-preset" type="button" data-playback-rate="0.5" aria-pressed="false" aria-label="0.5× 播放速度">0.5×</button>
            <button class="spring-preset" type="button" data-playback-rate="0.25" aria-pressed="false" aria-label="0.25× 播放速度">0.25×</button>
          </div>
          <p class="spring-target-hint">仅影响演示速度，不改变参数和导出代码。拖拽始终跟手。</p>
        </div>
        <div class="spring-target-control"><label for="spring-target-select">调节对象</label><select id="spring-target-select" class="spring-target-select" data-spring-target-select aria-label="选择要调节的动效元素"></select><p class="spring-target-hint">点选或聚焦画布中的卡片，也会切换到它的独立参数。</p></div>
        <div class="spring-effect-control"><label for="spring-effect-select">动效层</label><select id="spring-effect-select" class="spring-effect-select" data-spring-effect-select aria-label="选择当前元素要调节的真实动效层"></select><p class="spring-effect-hint">只显示当前组件实际使用的动效层。</p></div>
        <div class="motion-modes" role="group" aria-label="当前元素动效层的动画模式">
          <button class="spring-preset" type="button" data-motion-mode="spring" aria-pressed="true" data-active>Spring</button>
          <button class="spring-preset" type="button" data-motion-mode="cubic" aria-pressed="false">Cubic Bézier</button>
        </div>
        <div class="spring-controls" data-motion-controls="spring">
          <div class="spring-control"><label for="spring-response-number">响应时间 <small>ms</small></label><input id="spring-response-number" class="spring-number" data-spring-number="response" type="number" min="180" max="800" step="1" aria-label="响应时间，单位毫秒" /><input id="spring-response" class="spring-range" data-spring-input="response" type="range" min="180" max="800" step="1" /></div>
          <div class="spring-control"><label for="spring-damping-number">阻尼系数</label><input id="spring-damping-number" class="spring-number" data-spring-number="dampingFraction" type="number" min="0.45" max="1.15" step="0.01" aria-label="阻尼系数" /><input id="spring-damping" class="spring-range" data-spring-input="dampingFraction" type="range" min="0.45" max="1.15" step="0.01" /></div>
          <div class="spring-control"><label for="spring-velocity-number">初速度</label><input id="spring-velocity-number" class="spring-number" data-spring-number="initialVelocity" type="number" min="-8" max="8" step="0.25" aria-label="初速度" /><input id="spring-velocity" class="spring-range" data-spring-input="initialVelocity" type="range" min="-8" max="8" step="0.25" /></div>
        </div>
        <div class="spring-presets" data-motion-controls="spring" aria-label="Apple spring presets">
          <button class="spring-preset" type="button" data-spring-preset="snappy">Snappy</button>
          <button class="spring-preset" type="button" data-spring-preset="natural">Natural</button>
          <button class="spring-preset" type="button" data-spring-preset="bouncy">Bouncy</button>
        </div>
        <div class="cubic-controls" data-motion-controls="cubic" hidden>
          <div class="spring-control"><label for="cubic-duration">动画时长 <small>ms</small></label><input id="cubic-duration" class="spring-number" data-cubic-number="duration" type="number" min="80" max="2000" step="1" /><input class="spring-range" data-cubic-input="duration" type="range" min="80" max="2000" step="1" aria-label="Cubic 动画时长" /></div>
          <div class="cubic-points">
            <div class="spring-control"><label for="cubic-x1">X1</label><input id="cubic-x1" class="spring-number" data-cubic-number="x1" type="number" min="0" max="1" step="0.01" /><input class="spring-range" data-cubic-input="x1" type="range" min="0" max="1" step="0.01" aria-label="控制点 X1" /></div>
            <div class="spring-control"><label for="cubic-y1">Y1</label><input id="cubic-y1" class="spring-number" data-cubic-number="y1" type="number" min="-1" max="2" step="0.01" /><input class="spring-range" data-cubic-input="y1" type="range" min="-1" max="2" step="0.01" aria-label="控制点 Y1" /></div>
            <div class="spring-control"><label for="cubic-x2">X2</label><input id="cubic-x2" class="spring-number" data-cubic-number="x2" type="number" min="0" max="1" step="0.01" /><input class="spring-range" data-cubic-input="x2" type="range" min="0" max="1" step="0.01" aria-label="控制点 X2" /></div>
            <div class="spring-control"><label for="cubic-y2">Y2</label><input id="cubic-y2" class="spring-number" data-cubic-number="y2" type="number" min="-1" max="2" step="0.01" /><input class="spring-range" data-cubic-input="y2" type="range" min="-1" max="2" step="0.01" aria-label="控制点 Y2" /></div>
          </div>
          <div class="spring-presets" aria-label="Cubic presets">
            <button class="spring-preset" type="button" data-cubic-preset="ease">Ease</button>
            <button class="spring-preset" type="button" data-cubic-preset="easeOut">Ease Out</button>
            <button class="spring-preset" type="button" data-cubic-preset="easeInOut">Ease In Out</button>
          </div>
        </div>
        <div class="spring-preview" aria-hidden="true"><span class="spring-preview-dot"></span></div>
        <div class="spring-curve-card">
          <div class="spring-curve-head"><strong data-motion-curve-title>响应曲线</strong><span data-spring-curve-caption>0–960 ms</span></div>
          <svg class="spring-curve" viewBox="0 0 240 68" role="img" aria-label="当前 Apple spring 的物理响应曲线"><line class="spring-curve-grid" x1="0" y1="34" x2="240" y2="34"></line><line class="spring-curve-target" x1="0" y1="14" x2="240" y2="14"></line><polyline class="spring-curve-path" data-spring-curve points="0,54 240,14"></polyline></svg>
        </div>
        <p class="spring-lab-note" data-spring-note>响应越低越快；阻尼低于 1 会产生回弹。</p>
        <button class="spring-preview-button" type="button" data-spring-preview>预览弹簧</button>
        <details class="spring-export" data-spring-export>
          <summary>导出代码 <span>当前卡片 · 当前动效层</span></summary>
          <div class="spring-export-content">
            <label for="spring-export-stack">技术栈</label>
            <select id="spring-export-stack" class="spring-target-select" data-spring-export-stack>
              <option value="web">Web · 原生 JavaScript</option>
              <option value="react">React · Motion</option>
              <option value="swiftui">iOS / macOS · SwiftUI</option>
              <option value="compose">Android · Jetpack Compose</option>
            </select>
            <p class="spring-target-hint" data-spring-export-note></p>
            <span class="spring-export-filename" data-spring-export-filename></span>
            <textarea class="spring-export-code" data-spring-export-code readonly spellcheck="false" wrap="off" aria-label="当前动效层导出代码"></textarea>
            <div class="spring-export-actions"><button class="spring-preset" type="button" data-spring-export-copy>复制代码</button><button class="spring-preset" type="button" data-spring-export-download>下载文件</button></div>
            <p class="spring-export-status" data-spring-export-status role="status" aria-live="polite"></p>
          </div>
        </details>
      </div>
    </aside>

    <nav class="proto-picker" aria-label="Prototype variants">
      <span class="proto-picker-highlight" aria-hidden="true"></span>
      <button class="proto-picker-item" data-active aria-current="true">Lift List</button>
      <button class="proto-picker-item">Magnetic Board</button>
      <button class="proto-picker-item">Elastic Shelf</button>
      <span class="proto-picker-divider" aria-hidden="true"></span>
      <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
    </nav>

    <script>
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const springStorageKey = 'drag-spring-apple-settings-v4';
      const legacyElementSpringStorageKey = 'drag-spring-apple-settings-v3';
      const legacyComponentSpringStorageKey = 'drag-spring-apple-settings-v2';
      const legacyUnifiedSpringStorageKey = 'drag-spring-apple-settings-v1';
      const springLabLayoutStorageKey = 'drag-spring-lab-layout-v1';
      const springDefaults = { response: 0.32, dampingFraction: 0.8, initialVelocity: 0 };
      const springComponentKeys = ['lift', 'board', 'shelf'];
      const springComponentLabels = { lift: 'Lift List', board: 'Magnetic Board', shelf: 'Elastic Shelf' };
      const springTargets = {
        lift: [
          { key: 'lift-qa', label: 'QA the dark-mode pass' },
          { key: 'lift-beta', label: 'Send the beta invitation' },
          { key: 'lift-research', label: 'Review first-session notes' },
          { key: 'lift-handoff', label: 'Package the handoff' }
        ],
        board: [
          { key: 'board-rq-41', label: 'RQ-41 · Accessibility note' },
          { key: 'board-rq-42', label: 'RQ-42 · Payment confirmation' },
          { key: 'board-rq-37', label: 'RQ-37 · Empty-state narrative' },
          { key: 'board-rq-39', label: 'RQ-39 · Saved flow' },
          { key: 'board-rq-32', label: 'RQ-32 · Permission explainer' }
        ],
        shelf: [
          { key: 'shelf-sequence', label: 'Sequence · Exit timing' },
          { key: 'shelf-color', label: 'Color · Tonal lift' },
          { key: 'shelf-type', label: 'Type · Soft display' },
          { key: 'shelf-texture', label: 'Texture · Glass grain' }
        ]
      };
      const springEffects = {
        lift: [
          { key: 'reflow', label: '列表重排' },
          { key: 'landing', label: '松手落位' }
        ],
        board: [{ key: 'reflow', label: '目标列重排' }],
        shelf: [{ key: 'reflow', label: '托盘 / 货架落位' }]
      };
      const springEffectSpeeds = { reflow: 1.1, landing: 1 };
      const playbackRates = [1, 0.75, 0.5, 0.25];
      let playbackRate = 1;
      function setPlaybackRate(rate) {
        if (!playbackRates.includes(rate)) return;
        playbackRate = rate;
        document.querySelectorAll('[data-playback-rate]').forEach((button) => {
          const active = Number(button.dataset.playbackRate) === rate;
          button.toggleAttribute('data-active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        document.documentElement.style.setProperty('--demo-landing-duration', `${580 / rate}ms`);
        document.documentElement.style.setProperty('--demo-highlight-duration', `${150 / rate}ms`);
      }
      const springPresets = {
        snappy: { response: 0.24, dampingFraction: 0.92, initialVelocity: 0 },
        natural: { response: 0.32, dampingFraction: 0.8, initialVelocity: 0 },
        bouncy: { response: 0.46, dampingFraction: 0.58, initialVelocity: 0 }
      };
      const springProfiles = loadSpringProfiles();
      const cubicStorageKey = 'drag-spring-cubic-settings-v1';
      const cubicDefaults = { duration: 320, x1: 0.25, y1: 0.1, x2: 0.25, y2: 1 };
      const cubicPresets = {
        ease: { x1: 0.25, y1: 0.1, x2: 0.25, y2: 1 },
        easeOut: { x1: 0, y1: 0, x2: 0.58, y2: 1 },
        easeInOut: { x1: 0.42, y1: 0, x2: 0.58, y2: 1 }
      };
      const motionBySpring = new WeakMap();
      const motionProfiles = loadMotionProfiles();
      let activeSpringComponent = 'lift';
      const activeSpringTargets = Object.fromEntries(springComponentKeys.map((component) => [component, springTargets[component][0].key]));
      const activeSpringEffects = Object.fromEntries(springComponentKeys.map((component) => [component, springEffects[component][0].key]));
      let activeSpringTarget = activeSpringTargets[activeSpringComponent];
      let activeSpringEffect = activeSpringEffects[activeSpringComponent];
      let springSettings = springProfiles[activeSpringComponent][activeSpringTarget][activeSpringEffect];
      let cancelSpringPreview = null;

      function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

      function normalizeCubic(source) {
        return Object.fromEntries(Object.entries(cubicDefaults).map(([key, fallback]) => {
          const value = source?.[key];
          const min = key === 'duration' ? 80 : key.startsWith('x') ? 0 : -1;
          const max = key === 'duration' ? 2000 : key.startsWith('x') ? 1 : 2;
          const valid = typeof value === 'number' && Number.isFinite(value) ? clamp(value, min, max) : fallback;
          return [key, key === 'duration' ? Math.round(valid) : valid];
        }));
      }

      function loadMotionProfiles() {
        let stored;
        try { stored = JSON.parse(localStorage.getItem(cubicStorageKey)); } catch { /* Use isolated defaults. */ }
        return Object.fromEntries(springComponentKeys.map(component => [component,
          Object.fromEntries(springTargets[component].map(target => [target.key,
            Object.fromEntries(springEffects[component].map(effect => {
              const source = stored?.[component]?.[target.key]?.[effect.key];
              const profile = { mode: source?.mode === 'cubic' ? 'cubic' : 'spring', cubic: normalizeCubic(source?.cubic) };
              motionBySpring.set(springProfiles[component][target.key][effect.key], profile);
              return [effect.key, profile];
            }))
          ]))
        ]));
      }

      function currentMotion() { return motionProfiles[activeSpringComponent][activeSpringTarget][activeSpringEffect]; }
      function saveMotionProfiles() {
        try { localStorage.setItem(cubicStorageKey, JSON.stringify(motionProfiles)); } catch { /* Storage can be unavailable. */ }
      }

      function cubicProgress(fraction, { x1, y1, x2, y2 }) {
        if (fraction <= 0) return 0;
        if (fraction >= 1) return 1;
        const coordinate = (t, a, b) => 3 * (1-t)**2 * t * a + 3 * (1-t) * t*t * b + t*t*t;
        let low = 0, high = 1;
        // Invert Bezier X (elapsed fraction), then evaluate Y; do not use fraction as t.
        for (let i = 0; i < 32; i++) {
          const t = (low + high) / 2;
          const x = coordinate(t, x1, x2);
          if (x === fraction) return coordinate(t, y1, y2);
          if (x < fraction) low = t; else high = t;
        }
        return coordinate((low + high) / 2, y1, y2);
      }

      function cubicValue({ from = 0, to = 1, settings, onUpdate, onComplete }) {
        const cubic = { ...settings };
        let elapsed = 0, lastTime = performance.now(), frameId;
        function frame(now) {
          elapsed += Math.min(Math.max(0, now-lastTime), 32) * playbackRate;
          lastTime = now;
          const fraction = Math.min(1, elapsed / cubic.duration);
          onUpdate(from + (to-from) * cubicProgress(fraction, cubic));
          if (fraction >= 1) { onComplete?.(); return; }
          frameId = requestAnimationFrame(frame);
        }
        frameId = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(frameId);
      }

      function normalizeSpringSettings(source) {
        const number = (key, fallback) => Number.isFinite(Number(source?.[key])) ? Number(source[key]) : fallback;
        return {
          response: clamp(number('response', springDefaults.response), 0.18, 0.8),
          dampingFraction: clamp(number('dampingFraction', springDefaults.dampingFraction), 0.45, 1.15),
          initialVelocity: clamp(number('initialVelocity', springDefaults.initialVelocity), -8, 8)
        };
      }

      function createSpringProfiles(source) {
        return Object.fromEntries(springComponentKeys.map((component) => {
          const componentSource = source?.[component] ?? source;
          const componentFallback = normalizeSpringSettings(componentSource);
          return [component, Object.fromEntries(springTargets[component].map((target) => {
            const targetSource = componentSource?.[target.key] ?? componentFallback;
            return [target.key, Object.fromEntries(springEffects[component].map((effect) => [effect.key, normalizeSpringSettings(targetSource?.[effect.key] ?? targetSource)]))];
          }))];
        }));
      }

      function persistSpringProfiles(profiles) {
        try { localStorage.setItem(springStorageKey, JSON.stringify(profiles)); } catch { /* File previews can disable storage. */ }
        return profiles;
      }

      function loadSpringProfiles() {
        try {
          const stored = JSON.parse(localStorage.getItem(springStorageKey));
          if (stored && springComponentKeys.every((key) => stored[key])) {
            return createSpringProfiles(stored);
          }
          const legacyElement = JSON.parse(localStorage.getItem(legacyElementSpringStorageKey));
          if (legacyElement) return persistSpringProfiles(createSpringProfiles(legacyElement));
          const legacyComponent = JSON.parse(localStorage.getItem(legacyComponentSpringStorageKey));
          if (legacyComponent) return persistSpringProfiles(createSpringProfiles(legacyComponent));
          const unified = JSON.parse(localStorage.getItem(legacyUnifiedSpringStorageKey));
          return persistSpringProfiles(createSpringProfiles(unified));
        } catch {
          return createSpringProfiles();
        }
      }

      function saveSpringSettings() {
        try { localStorage.setItem(springStorageKey, JSON.stringify(springProfiles)); } catch { /* File previews can disable storage. */ }
      }

      function loadSpringLabPosition() {
        try {
          const stored = JSON.parse(localStorage.getItem(springLabLayoutStorageKey));
          return Number.isFinite(stored?.left) && Number.isFinite(stored?.top) ? stored : null;
        } catch { return null; }
      }

      function saveSpringLabPosition(position) {
        try { localStorage.setItem(springLabLayoutStorageKey, JSON.stringify(position)); } catch { /* File previews can disable storage. */ }
      }

      function setSpringLabPosition(lab, left, top, persist = true) {
        const rect = lab.getBoundingClientRect();
        const inset = 12;
        const position = {
          left: Math.round(clamp(left, inset, Math.max(inset, window.innerWidth - rect.width - inset))),
          top: Math.round(clamp(top, inset, Math.max(inset, window.innerHeight - rect.height - inset)))
        };
        lab.style.left = `${position.left}px`;
        lab.style.top = `${position.top}px`;
        lab.style.right = 'auto';
        lab.style.bottom = 'auto';
        lab.toggleAttribute('data-positioned', true);
        if (persist) saveSpringLabPosition(position);
      }

      function selectSpringComponent(index) {
        const nextComponent = springComponentKeys[index];
        if (!nextComponent || nextComponent === activeSpringComponent) return;
        activeSpringComponent = nextComponent;
        activeSpringTarget = activeSpringTargets[activeSpringComponent];
        activeSpringEffect = activeSpringEffects[activeSpringComponent];
        springSettings = springProfiles[activeSpringComponent][activeSpringTarget][activeSpringEffect];
        if (document.querySelector('.spring-lab')) {
          syncSpringLab();
          replaySpringPreview();
        }
      }

      function selectSpringTarget(target) {
        if (!springTargets[activeSpringComponent].some((entry) => entry.key === target)) return;
        activeSpringTarget = target;
        activeSpringTargets[activeSpringComponent] = target;
        springSettings = springProfiles[activeSpringComponent][activeSpringTarget][activeSpringEffect];
        syncSpringLab();
        replaySpringPreview();
      }

      function selectSpringEffect(effect) {
        if (!springEffects[activeSpringComponent].some((entry) => entry.key === effect)) return;
        activeSpringEffect = effect;
        activeSpringEffects[activeSpringComponent] = effect;
        springSettings = springProfiles[activeSpringComponent][activeSpringTarget][activeSpringEffect];
        syncSpringLab();
        replaySpringPreview();
      }

      function springSettingsForElement(element, effect = 'reflow') {
        return springProfiles[activeSpringComponent]?.[element?.dataset?.motionTarget]?.[effect] || springSettings;
      }

      function appleSpring({ mass = 1, speed = 1, initialVelocity, settings = springSettings } = {}) {
        const response = clamp(settings.response / speed, 0.12, 1.2);
        const angularFrequency = (2 * Math.PI) / response;
        return {
          stiffness: angularFrequency ** 2 * mass,
          damping: 2 * settings.dampingFraction * angularFrequency * mass,
          initialVelocity: initialVelocity ?? settings.initialVelocity
        };
      }

      function springValue({ from = 0, to = 1, mass = 1, speed = 1, initialVelocity, settings, onUpdate, onComplete }) {
        if (reduceMotion.matches) {
          onUpdate(to);
          onComplete?.();
          return () => {};
        }
        const motion = motionBySpring.get(settings || springSettings);
        if (motion?.mode === 'cubic') return cubicValue({ from, to, settings: motion.cubic, onUpdate, onComplete });
        const spring = appleSpring({ mass, speed, initialVelocity, settings });
        let value = from;
        let velocity = spring.initialVelocity * (to - from);
        let lastTime = performance.now();
        const step = 1 / 240;
        let elapsed = 0;
        let frameId;
        function frame(now) {
          // Fixed simulation steps keep the trajectory identical at every playback rate.
          elapsed += Math.min((now - lastTime) / 1000, 0.032) * playbackRate;
          lastTime = now;
          let settled = false;
          while (elapsed + 1e-10 >= step) {
            elapsed = Math.max(0, elapsed - step);
            const force = -spring.stiffness * (value - to);
            const dampingForce = -spring.damping * velocity;
            velocity += ((force + dampingForce) / mass) * step;
            value += velocity * step;
            if (Math.abs(velocity) < 0.015 && Math.abs(value - to) < 0.015) {
              settled = true;
              break;
            }
          }
          onUpdate(value);
          if (settled) {
            onUpdate(to);
            onComplete?.();
            return;
          }
          frameId = requestAnimationFrame(frame);
        }
        frameId = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(frameId);
      }

      function springTransform(element, x, y, options = {}, done) {
        springValue({
          from: 0,
          to: 1,
          speed: options.speed || 1,
          initialVelocity: options.initialVelocity,
          settings: options.settings || springSettingsForElement(element, options.effect || 'reflow'),
          onUpdate(progress) {
            element.style.transform = `translate3d(${x * (1 - progress)}px, ${y * (1 - progress)}px, 0)`;
            if (options.opacityFrom !== undefined) element.style.opacity = options.opacityFrom + (1 - options.opacityFrom) * progress;
          },
          onComplete() {
            element.style.transform = '';
            element.style.opacity = '';
            done?.();
          }
        });
      }

      function springFlip(elements, mutate, effect = 'reflow') {
        const before = new Map(elements.map((element) => [element, element.getBoundingClientRect()]));
        mutate();
        elements.forEach((element) => {
          const first = before.get(element);
          const last = element.getBoundingClientRect();
          if (!first || !last || (!first.width && !last.width)) return;
          const x = first.left - last.left;
          const y = first.top - last.top;
          if (Math.abs(x) < 1 && Math.abs(y) < 1) return;
          springTransform(element, x, y, { speed: springEffectSpeeds[effect], effect, settings: springSettingsForElement(element, effect) });
        });
      }

      function matchingPreset() {
        return Object.entries(springPresets).find(([, preset]) => Object.keys(preset).every((key) => Math.abs(preset[key] - springSettings[key]) < 0.006))?.[0];
      }

      function controlValue(key) {
        return key === 'response' ? Math.round(springSettings.response * 1000) : springSettings[key];
      }

      function settingValue(input) {
        const raw = Number(input.value);
        const min = Number(input.min);
        const max = Number(input.max);
        if (!Number.isFinite(raw) || raw < min || raw > max) return null;
        return input.dataset.springInput === 'response' || input.dataset.springNumber === 'response' ? raw / 1000 : raw;
      }

      function drawSpringCurve() {
        const lab = document.querySelector('.spring-lab');
        const curve = lab.querySelector('[data-spring-curve]');
        const targetLabel = springTargets[activeSpringComponent].find((entry) => entry.key === activeSpringTarget)?.label;
        const effectLabel = springEffects[activeSpringComponent].find((entry) => entry.key === activeSpringEffect)?.label;
        const motion = currentMotion();
        if (motion.mode === 'cubic') {
          const values = Array.from({ length: 73 }, (_, i) => cubicProgress(i / 72, motion.cubic));
          const min = Math.min(0, ...values), max = Math.max(1, ...values);
          const y = value => 60 - (value - min) / (max - min) * 52;
          curve.setAttribute('points', values.map((value, i) => `${(240*i/72).toFixed(1)},${y(value).toFixed(1)}`).join(' '));
          for (const [selector, value] of [['.spring-curve-grid', 0], ['.spring-curve-target', 1]]) {
            const line = lab.querySelector(selector);
            line.setAttribute('y1', y(value)); line.setAttribute('y2', y(value));
          }
          lab.querySelector('[data-spring-curve-caption]').textContent = `0–${motion.cubic.duration} ms · 时间 →`;
          curve.closest('svg').setAttribute('aria-label', `${targetLabel} · ${effectLabel} 的 Cubic Bézier 时间与进度曲线`);
          return;
        }
        for (const [selector, value] of [['.spring-curve-grid', 34], ['.spring-curve-target', 14]]) {
          const line = lab.querySelector(selector);
          line.setAttribute('y1', value); line.setAttribute('y2', value);
        }
        const duration = clamp(springSettings.response * 3.2, 0.48, 1.6);
        const steps = 72;
        const dt = duration / steps;
        const spring = appleSpring();
        let value = 0;
        let velocity = spring.initialVelocity;
        const points = [];
        for (let step = 0; step <= steps; step++) {
          const x = (240 * step) / steps;
          const y = clamp(54 - value * 40, 4, 64);
          points.push(`${x.toFixed(1)},${y.toFixed(1)}`);
          const force = -spring.stiffness * (value - 1);
          const dampingForce = -spring.damping * velocity;
          velocity += ((force + dampingForce) * dt);
          value += velocity * dt;
        }
        curve.setAttribute('points', points.join(' '));
        lab.querySelector('[data-spring-curve-caption]').textContent = `0–${Math.round(duration * 1000)} ms`;
        curve.closest('svg').setAttribute('aria-label', `${targetLabel} · ${effectLabel} 的物理弹簧响应曲线`);
      }

  reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches,
  onComplete
} = {}) {
  if (reduceMotion) { onUpdate(1); onComplete?.(); return () => {}; }
  let elapsed = 0, lastTime = performance.now(), frameId;
  function frame(now) {
    elapsed += Math.min(Math.max(0, now - lastTime), 32);
    lastTime = now;
    const fraction = Math.min(1, elapsed / cubicSettings.duration);
    onUpdate(cubicProgress(fraction, cubicSettings));

  }
  frameId = requestAnimationFrame(frame);
  return () => cancelAnimationFrame(frameId);

          };
          input.addEventListener(input.type === 'range' ? 'input' : 'change', commit);
          if (input.type === 'number') input.addEventListener('keydown', event => { if (event.key === 'Enter') input.blur(); });
        });
        lab.querySelectorAll('[data-cubic-preset]').forEach(button => {
          button.addEventListener('click', () => {
            Object.assign(currentMotion().cubic, cubicPresets[button.dataset.cubicPreset]);
            saveMotionProfiles(); syncSpringLab(); replaySpringPreview();
          });
        });
        lab.querySelectorAll('[data-playback-rate]').forEach((button) => {
          button.addEventListener('click', () => setPlaybackRate(Number(button.dataset.playbackRate)));
        });
        if (compact.matches) lab.removeAttribute('data-open');
        const storedPosition = loadSpringLabPosition();
        if (storedPosition) setSpringLabPosition(lab, storedPosition.left, storedPosition.top, false);
        lab.querySelector('[data-spring-target-select]').addEventListener('change', (event) => selectSpringTarget(event.target.value));
        lab.querySelector('[data-spring-effect-select]').addEventListener('change', (event) => selectSpringEffect(event.target.value));
        lab.querySelectorAll('[data-spring-input]').forEach((input) => {
          input.addEventListener('input', () => {
            const nextValue = settingValue(input);
            if (nextValue === null) return;
            springSettings[input.dataset.springInput] = nextValue;
            saveSpringSettings(); syncSpringLab(); replaySpringPreview();
          });
        });
        lab.querySelectorAll('[data-spring-number]').forEach((input) => {
          const commit = () => {
            const nextValue = settingValue(input);
            if (nextValue === null) return false;
            springSettings[input.dataset.springNumber] = nextValue;
            saveSpringSettings(); syncSpringLab(); replaySpringPreview();
            return true;
          };
          input.addEventListener('change', () => { if (!commit()) syncSpringLab(); });
          input.addEventListener('keydown', (event) => { if (event.key === 'Enter') input.blur(); });
        });
        lab.querySelectorAll('[data-spring-preset]').forEach((button) => {
          button.addEventListener('click', () => {
            Object.assign(springSettings, springPresets[button.dataset.springPreset]);
            saveSpringSettings();
            syncSpringLab();
            replaySpringPreview();
          });
        });
        lab.querySelector('.spring-lab-toggle').addEventListener('click', () => {
          lab.toggleAttribute('data-open');
          syncSpringLab();
          requestAnimationFrame(keepLabVisible);
        });
        handle.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          const rect = lab.getBoundingClientRect();
          const session = { pointerId: event.pointerId, left: rect.left, top: rect.top, x: event.clientX, y: event.clientY };
          lab.toggleAttribute('data-dragging', true);
          handle.setPointerCapture(event.pointerId);
          const move = (moveEvent) => {
            if (moveEvent.pointerId !== session.pointerId) return;
            setSpringLabPosition(lab, session.left + moveEvent.clientX - session.x, session.top + moveEvent.clientY - session.y);
          };
          const up = (upEvent) => {
            if (upEvent.pointerId !== session.pointerId) return;
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            lab.removeAttribute('data-dragging');
          };
          window.addEventListener('pointermove', move);
          window.addEventListener('pointerup', up);
        });
        handle.addEventListener('keydown', (event) => {
          const delta = event.shiftKey ? 40 : 12;
          const directions = { ArrowLeft: [-delta, 0], ArrowRight: [delta, 0], ArrowUp: [0, -delta], ArrowDown: [0, delta] };
          const movement = directions[event.key];
          if (!movement) return;
          event.preventDefault();
          event.stopPropagation();
          const rect = lab.getBoundingClientRect();
          setSpringLabPosition(lab, rect.left + movement[0], rect.top + movement[1]);
        });
        window.addEventListener('resize', () => requestAnimationFrame(keepLabVisible));
        lab.querySelector('[data-spring-preview]').addEventListener('click', replaySpringPreview);
        syncSpringLab();
        requestAnimationFrame(replaySpringPreview);
      }

      function announce(root, message) {
        const status = root.querySelector('.live-status');
        if (status) status.textContent = '';
        requestAnimationFrame(() => { if (status) status.textContent = message; });
      }

      function dragGhost(source, event) {
        const rect = source.getBoundingClientRect();
        const ghost = source.cloneNode(true);
        ghost.classList.add('drag-ghost');
        ghost.removeAttribute('id');
        ghost.setAttribute('aria-hidden', 'true');
        // Preserve viewport positioning and grid-stretched size outside the source layout.
        ghost.style.position = 'fixed';
        ghost.style.width = `${rect.width}px`;
        ghost.style.height = `${rect.height}px`;
        ghost.style.left = `${rect.left}px`;
        ghost.style.top = `${rect.top}px`;
        document.body.append(ghost);
        return { ghost, rect, offsetX: event.clientX - rect.left, offsetY: event.clientY - rect.top };
      }

      function moveGhost(session, event, scale = 1.025) {
        session.ghost.style.transform = `translate3d(${event.clientX - session.rect.left - session.offsetX}px, ${event.clientY - session.rect.top - session.offsetY}px, 0) scale(${scale})`;
      }

      function targetAt(event, selector) {
        return document.elementsFromPoint(event.clientX, event.clientY).find((element) => element.matches?.(selector) || element.closest?.(selector))?.closest?.(selector);
      }

      function shelfCard(type, title, meta, orb) {
        return `<article class="shelf-card" tabindex="0" data-drag-item data-motion-target="shelf-${type.toLowerCase()}" style="--orb:${orb}" aria-label="${title}. Press Space to pick up."><span class="asset-type">${type}</span><strong>${title}</strong><small>${meta}</small></article>`;
      }

      function setupLift(root) {
        const list = root.querySelector('.task-list');
        let keyboardCard = null;
        function cards() { return [...list.querySelectorAll('.list-card')]; }
        function reorder(card, targetIndex) {
          const all = cards();
          const currentIndex = all.indexOf(card);
          if (targetIndex < 0 || targetIndex >= all.length || currentIndex === targetIndex) return false;
          springFlip(all, () => {
            const current = cards();
            const reference = current[targetIndex + (targetIndex > currentIndex ? 1 : 0)];
            list.insertBefore(card, reference || null);
          });
          return true;
        }
        cards().forEach((card) => {
          card.addEventListener('pointerdown', (event) => {
            if (event.button !== 0 || keyboardCard) return;
            event.preventDefault();
            const placeholder = document.createElement('div');
            placeholder.className = 'list-placeholder';
            placeholder.style.height = `${card.getBoundingClientRect().height}px`;
            const session = dragGhost(card, event);
            card.replaceWith(placeholder);
            card.classList.add('is-pointer-drag');
            announce(root, `Picked up ${card.querySelector('strong').textContent}.`);
            const move = (moveEvent) => {
              moveGhost(session, moveEvent, 1.018);
              const siblings = [...list.children].filter((entry) => entry !== placeholder);
              const next = siblings.find((entry) => moveEvent.clientY < entry.getBoundingClientRect().top + entry.getBoundingClientRect().height / 2);
              if (next && next.previousElementSibling !== placeholder) springFlip([...list.children], () => list.insertBefore(placeholder, next));
              if (!next && placeholder !== list.lastElementChild) springFlip([...list.children], () => list.append(placeholder));
            };
            const up = () => {
              window.removeEventListener('pointermove', move);
              window.removeEventListener('pointerup', up);
              const target = placeholder.getBoundingClientRect();
              const ghostBox = session.ghost.getBoundingClientRect();
              placeholder.replaceWith(card);
              card.classList.remove('is-pointer-drag');
              card.classList.add('landing');
              springTransform(card, ghostBox.left - target.left, ghostBox.top - target.top, { opacityFrom: .36, effect: 'landing' }, () => card.classList.remove('landing'));
              session.ghost.remove();
              announce(root, `${card.querySelector('strong').textContent} moved to position ${cards().indexOf(card) + 1}.`);
            };
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up, { once: true });
          });
          card.addEventListener('keydown', (event) => {
            if (event.key === ' ' || event.key === 'Enter') {
              event.preventDefault(); event.stopPropagation();
              if (!keyboardCard) {
                keyboardCard = card;
                card.classList.add('is-key-grabbed');
                announce(root, `Picked up ${card.querySelector('strong').textContent}. Use up or down arrow to reorder, then Enter to drop.`);
              } else if (keyboardCard === card) {
                keyboardCard.classList.remove('is-key-grabbed');
                announce(root, `${card.querySelector('strong').textContent} dropped at position ${cards().indexOf(card) + 1}.`);
                keyboardCard = null;
              }
              return;
            }
            if (!keyboardCard || keyboardCard !== card) return;
            if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
              event.preventDefault(); event.stopPropagation();
              const index = cards().indexOf(card);
              const changed = reorder(card, index + (event.key === 'ArrowUp' ? -1 : 1));
              if (changed) announce(root, `${card.querySelector('strong').textContent} is now position ${cards().indexOf(card) + 1}.`);
            }
            if (event.key === 'Escape') { event.stopPropagation(); keyboardCard.classList.remove('is-key-grabbed'); keyboardCard = null; announce(root, 'Reorder cancelled.'); }
          });
        });
      }

      function setupBoard(root) {
        const board = root.querySelector('[data-board]');
        const lanes = () => [...board.querySelectorAll('[data-lane]')];
        let keyboard = null;
        function cards() { return [...board.querySelectorAll('.board-card')]; }
        function setTarget(lane) { lanes().forEach((entry) => entry.classList.toggle('is-drop-target', entry === lane)); }
        function updateCounts() { lanes().forEach((lane) => { lane.querySelector('.lane-title span').textContent = lane.querySelectorAll('.board-card').length; }); }
        function placeCard(card, lane, before = null) {
          const source = card.closest('[data-lane]');
          const destination = lane.querySelector('.board-cards');
          const alreadyPlaced = source === lane && (before ? card.nextElementSibling === before : card === destination.lastElementChild);
          if (alreadyPlaced) return false;
          springFlip(cards(), () => destination.insertBefore(card, before));
          updateCounts();
          return true;
        }
        function moveCard(card, lane) {
          if (!placeCard(card, lane)) return;
          announce(root, `${card.querySelector('h2').textContent} moved to ${lane.querySelector('strong').textContent}.`);
        }
        cards().forEach((card) => {
          card.addEventListener('pointerdown', (event) => {
            if (event.button !== 0 || keyboard) return;
            event.preventDefault();
            const session = dragGhost(card, event);
            card.classList.add('is-pointer-drag');
            card.setPointerCapture(event.pointerId);
            announce(root, `Picked up ${card.querySelector('h2').textContent}.`);
            const origin = { lane: card.closest('[data-lane]'), next: card.nextElementSibling };
            let activeLane = null;
            const move = (moveEvent) => {
              if (moveEvent.pointerId !== event.pointerId) return;
              moveGhost(session, moveEvent);
              const lane = targetAt(moveEvent, '[data-lane]');
              if (lane !== activeLane) {
                activeLane = lane;
                setTarget(activeLane);
                if (activeLane) placeCard(card, activeLane, activeLane === origin.lane && origin.next?.isConnected ? origin.next : null);
              }
            };
            const up = (upEvent) => {
              if (upEvent.pointerId !== event.pointerId) return;
              window.removeEventListener('pointermove', move);
              window.removeEventListener('pointerup', up);
              const lane = targetAt(upEvent, '[data-lane]');
              setTarget(null);
              if (lane) {
                placeCard(card, lane, lane === origin.lane && origin.next?.isConnected ? origin.next : null);
                announce(root, `${card.querySelector('h2').textContent} moved to ${lane.querySelector('strong').textContent}.`);
              } else {
                placeCard(card, origin.lane, origin.next?.isConnected ? origin.next : null);
                announce(root, 'No lane selected. Card returned to its original position.');
              }
              card.classList.remove('is-pointer-drag');
              session.ghost.remove();
            };
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up);
          });
          card.addEventListener('keydown', (event) => {
            if ((event.key === ' ' || event.key === 'Enter') && !keyboard) {
              event.preventDefault(); event.stopPropagation();
              keyboard = { card, index: lanes().indexOf(card.closest('[data-lane]')) };
              card.classList.add('is-key-grabbed'); setTarget(lanes()[keyboard.index]);
              announce(root, `Picked up ${card.querySelector('h2').textContent}. Use left or right arrow to choose a lane, then Enter to drop.`);
              return;
            }
            if (!keyboard || keyboard.card !== card) return;
            if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
              event.preventDefault(); event.stopPropagation();
              keyboard.index = (keyboard.index + (event.key === 'ArrowLeft' ? -1 : 1) + lanes().length) % lanes().length;
              setTarget(lanes()[keyboard.index]);
              announce(root, `Target ${lanes()[keyboard.index].querySelector('strong').textContent}.`);
            }
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault(); event.stopPropagation();
              const target = lanes()[keyboard.index];
              card.classList.remove('is-key-grabbed'); setTarget(null); moveCard(card, target); keyboard = null;
            }
            if (event.key === 'Escape') { event.stopPropagation(); card.classList.remove('is-key-grabbed'); setTarget(null); keyboard = null; announce(root, 'Move cancelled.'); }
          });
        });
      }

      function setupShelf(root) {
        const workspace = root.querySelector('[data-shelf-workspace]');
        const shelf = workspace.querySelector('[data-shelf]');
        const tray = workspace.querySelector('[data-tray]');
        const trayGrid = workspace.querySelector('[data-tray-grid]');
        let keyboard = null;
        function cards() { return [...workspace.querySelectorAll('.shelf-card')]; }
        function updateTray() {
          const trayCards = trayGrid.querySelectorAll('.shelf-card');
          const empty = trayGrid.querySelector('.tray-empty');
          if (trayCards.length && empty) empty.remove();
          if (!trayCards.length && !empty) trayGrid.innerHTML = '<div class="tray-empty">Drag a reference here<br />to keep it in reach.</div>';
          tray.querySelector('[data-tray-count]').textContent = trayCards.length ? `${trayCards.length} saved` : 'Drop here';
        }
        function setTarget(target) { shelf.classList.toggle('is-drop-target', target === shelf); tray.classList.toggle('is-drop-target', target === tray); }
        function moveCard(card, destination) {
          const current = card.closest('[data-shelf], [data-tray]');
          if (current === destination) return;
          const destinationGrid = destination === tray ? trayGrid : shelf;
          const empty = trayGrid.querySelector('.tray-empty');
          springFlip(cards(), () => { if (empty && destination === tray) empty.remove(); destinationGrid.append(card); });
          updateTray();
          announce(root, `${card.querySelector('strong').textContent} ${destination === tray ? 'added to today’s tray' : 'returned to the shelf'}.`);
        }
        cards().forEach((card) => {
          card.addEventListener('pointerdown', (event) => {
            if (event.button !== 0 || keyboard) return;
            event.preventDefault();
            const session = dragGhost(card, event);
            card.classList.add('is-pointer-drag'); card.setPointerCapture(event.pointerId);
            let active = null;
            announce(root, `Picked up ${card.querySelector('strong').textContent}.`);
            const move = (moveEvent) => { moveGhost(session, moveEvent, 1.04); const target = targetAt(moveEvent, '[data-shelf], [data-tray]'); if (target !== active) { active = target; setTarget(active); } };
            const up = (upEvent) => {
              card.removeEventListener('pointermove', move); card.removeEventListener('pointerup', up);
              const target = targetAt(upEvent, '[data-shelf], [data-tray]'); setTarget(null);
              if (target) moveCard(card, target); else announce(root, 'No destination selected. Card returned to its original location.');
              card.classList.remove('is-pointer-drag'); session.ghost.remove();
            };
            card.addEventListener('pointermove', move); card.addEventListener('pointerup', up, { once: true });
          });
          card.addEventListener('keydown', (event) => {
            if ((event.key === ' ' || event.key === 'Enter') && !keyboard) {
              event.preventDefault(); event.stopPropagation(); keyboard = { card, target: card.closest('[data-shelf]') ? shelf : tray };
              card.classList.add('is-key-grabbed'); setTarget(keyboard.target);
              announce(root, `Picked up ${card.querySelector('strong').textContent}. Use left or right arrow to choose shelf or tray, then Enter to drop.`); return;
            }
            if (!keyboard || keyboard.card !== card) return;
            if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); event.stopPropagation(); keyboard.target = keyboard.target === shelf ? tray : shelf; setTarget(keyboard.target); announce(root, `Target ${keyboard.target === tray ? 'today’s tray' : 'motion references shelf'}.`); }
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); event.stopPropagation(); const target = keyboard.target; card.classList.remove('is-key-grabbed'); setTarget(null); moveCard(card, target); keyboard = null; }
            if (event.key === 'Escape') { event.stopPropagation(); card.classList.remove('is-key-grabbed'); setTarget(null); keyboard = null; announce(root, 'Move cancelled.'); }
          });
        });
      }

      function setupSpringTargetSelection(root) {
        const selectTargetFromEvent = (event) => {
          const element = event.target.closest?.('[data-motion-target]');
          if (element) selectSpringTarget(element.dataset.motionTarget);
        };
        root.addEventListener('pointerdown', selectTargetFromEvent, true);
        root.addEventListener('focusin', selectTargetFromEvent);
      }

      function setupVariant() {
        const root = stage.firstElementChild;
        if (!root) return;
        setupSpringTargetSelection(root);
        if (root.dataset.variant === 'lift') setupLift(root);
        if (root.dataset.variant === 'board') setupBoard(root);
        if (root.dataset.variant === 'shelf') setupShelf(root);
        syncSpringLab();
      }

      const observer = new MutationObserver(setupVariant);
      observer.observe(document.getElementById('stage'), { childList: true });

      const variants = [renderLiftList, renderMagneticBoard, renderElasticShelf];
      const stage = document.getElementById('stage');
      const picker = document.querySelector('.proto-picker');
      const highlight = picker.querySelector('.proto-picker-highlight');
      const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
      const replay = picker.querySelector('.proto-picker-replay');
      let current = 0;

      function moveHighlight() {
        const el = items[current];
        highlight.style.width = el.offsetWidth + 'px';
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        stage.innerHTML = '';
        // Clear first, render next frame, so entrance animations re-run.
        requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        selectSpringComponent(i);
        items.forEach((el, j) => {
          el.toggleAttribute('data-active', j === i);
          if (j === i) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set('v', i + 1);
        history.replaceState(null, '', url);
        mount(i);
      }

      items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
      replay?.addEventListener('click', () => mount(current));
      window.addEventListener('resize', moveHighlight);

      document.addEventListener('keydown', (e) => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
        if (e.target.closest('.spring-lab')) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
        else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
        else if (e.key === 'r' || e.key === 'R') mount(current);
      });

      setupSpringLab();
      setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
      // Enable the slide only after first paint, so load doesn't animate.
      requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
    </script>
  </body>
</html>
